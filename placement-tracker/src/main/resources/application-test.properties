# Test Configuration
spring.application.name=placement-tracker-test
server.port=8081

# H2 In-Memory Database (for testing, no Docker needed)
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# H2 Console (optional - for debugging)
spring.h2.console.enabled=true

# JPA/Hibernate - Create/Drop for tests
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Disable Elasticsearch for tests (optional)
logging.level.root=INFO
logging.level.com.example.placement_tracker=DEBUG