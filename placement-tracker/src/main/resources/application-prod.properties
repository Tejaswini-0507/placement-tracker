# ============================================================
# PRODUCTION CONFIGURATION FOR RENDER DEPLOYMENT
# ============================================================

spring.application.name=placement-tracker
server.port=8081
server.servlet.context-path=/api

# ============================================================
# DATABASE - PostgreSQL (Render Managed)
# ============================================================
# Use environment variables set by Render
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================================
# JPA/Hibernate
# ============================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ============================================================
# Connection Pool - HikariCP (Production Settings)
# ============================================================
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.connection-timeout=20000

# ============================================================
# Hibernate Performance
# ============================================================
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ============================================================
# Elasticsearch - DISABLED (Removed for FREE tier)
# ============================================================
# Elasticsearch is disabled to keep deployment FREE
# If you need search later, re-enable and configure

# ============================================================
# JWT Configuration
# ============================================================
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=86400000

# ============================================================
# File Upload
# ============================================================
app.upload.resume-dir=/tmp/resumes
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ============================================================
# Logging
# ============================================================
logging.level.root=INFO
logging.level.com.example.placement_tracker=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.security=WARN

# ============================================================
# Server Configuration
# ============================================================
server.compression.enabled=true
server.compression.min-response-size=1024
server.error.include-message=always
server.error.include-stacktrace=never

# ============================================================
# CORS Configuration (if needed for frontend)
# ============================================================
# Add your frontend URL here when deployed
# Example: https://your-frontend.netlify.app