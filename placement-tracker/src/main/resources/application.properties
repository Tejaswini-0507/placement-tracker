spring.application.name=placement-tracker

spring.datasource.url=jdbc:postgresql://localhost:5432/placement_tracker
spring.datasource.username=placement_user
spring.datasource.password=placement_password
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.elasticsearch.uris=http://localhost:9200

server.port=8081
server.servlet.context-path=/api

logging.level.root=INFO
logging.level.com.placement=DEBUG


